[project]
name = "apiverve-anagrampuzzlegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Anagram Puzzle Generator creates word puzzles where players rearrange scrambled letters to form valid words, with optional hints."
keywords = ["anagram", "word puzzle", "rearrange letters", "word game", "vocabulary"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/anagrampuzzle?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/anagrampuzzle?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/anagrampuzzle-api"
Twitter = "https://twitter.com/apivervehq"
